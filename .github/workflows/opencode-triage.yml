name: opencode-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: |
      github.event.issue.user.type != 'Bot' &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: kimi-code-plan-global/k3-256k
          share: false
          prompt: |
            Выполни только предварительный triage нового issue по .agents/skills/triage/SKILL.md.
            Используй метки из docs/agents/triage-labels.md, термины GLOSSARY.md и прочитай код,
            чтобы проверить, не реализовано ли requested behavior и нет ли prior rejection.

            Опубликуй краткий разбор текущего поведения и рекомендацию. Если данных не хватает,
            задай конкретные вопросы и примени needs-info; иначе примени needs-triage и дождись
            решения человека. Добавь category label bug или enhancement. Каждый triage-комментарий
            начинай с «> *This was generated by AI during triage.*».

            Не изменяй файлы и код, не создавай ветки, PR, спецификации или тикеты, не закрывай
            issue и не начинай реализацию без явной команды человека в обсуждении.
